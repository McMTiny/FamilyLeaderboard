<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Night">
<meta name="theme-color" content="#0B3D2E">
<title>Game Night Tracker</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root {
  --felt:#0B3D2E; --felt2:#145A32; --gold:#D4AF37; --gold-lt:#F5E6A8;
  --win:#C6EFCE; --win-tx:#0B6E4F; --loss:#FDDCDC; --loss-tx:#A6192E;
  --tie:#FEF3CD; --tie-tx:#856404;
  --surf:#FFFFFF; --surf2:#F5F7F5; --bdr:#E0E7E0;
  --txt:#1A1A1A; --txt2:#5A6A5A; --r:12px;
  --shadow:0 2px 12px rgba(11,61,46,.10); --tabh:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;height:100%;width:100%;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--surf2);color:var(--txt);overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;height:100%;width:100%;max-width:480px;margin:0 auto;position:relative;background:var(--surf2);overflow-x:hidden}
#hdr{background:var(--felt);color:#fff;padding:env(safe-area-inset-top,12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;min-height:56px}
#hdr h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
#hdr .sub{font-size:11px;opacity:.65;margin-top:1px}
#content{flex:1;overflow-y:auto;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px))}
#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--tabh) + env(safe-area-inset-bottom,0px));background:var(--surf);border-top:1px solid var(--bdr);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--txt2);font-size:10px;font-weight:500;transition:color .15s;border:none;background:none;padding:0}
.tab.active{color:var(--felt)}
.tab svg{width:22px;height:22px}
.card{background:var(--surf);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:10px}
/* Leaderboard */
.lb-hero{background:linear-gradient(135deg,var(--felt) 0%,var(--felt2) 100%);color:#fff;padding:20px 16px;text-align:center}
.lb-hero .crown{font-size:32px;margin-bottom:4px}
.lb-hero .lname{font-size:22px;font-weight:700}
.lb-hero .lnet{font-size:15px;opacity:.8;margin-top:2px}
.lb-hero .lprob{display:inline-block;margin-top:8px;background:var(--gold);color:#3a2800;font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px}
.lb-row{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:1px solid var(--bdr)}
.lb-row:last-child{border-bottom:none}
.lb-rank{width:26px;height:26px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--txt2);flex-shrink:0}
.r1{background:var(--gold)!important;color:#3a2800!important}
.r2{background:#C0C0C0!important;color:#333!important}
.r3{background:#CD7F32!important;color:#fff!important}
.lb-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-stats{font-size:11px;color:var(--txt2);margin-top:2px}
.lb-right{text-align:right;flex-shrink:0}
.lb-net{font-size:15px;font-weight:700}
.lb-prob{font-size:11px;color:var(--txt2);margin-top:2px}
.pos{color:var(--win-tx)} .neg{color:var(--loss-tx)}
.prob-track{height:6px;background:var(--surf2);border-radius:3px;display:flex;overflow:hidden;gap:1px}
.prob-seg{height:100%;border-radius:2px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 12px}
.stat-card{background:var(--surf);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.stat-lbl{font-size:11px;color:var(--txt2);font-weight:500}
.stat-val{font-size:20px;font-weight:700;margin-top:2px}
/* Form */
.form-card{background:var(--surf);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 16px 12px}
.form-title{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--felt)}
.field{margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--txt2);display:block;margin-bottom:5px}
.field input,.field select{width:100%;height:42px;border:1.5px solid var(--bdr);border-radius:8px;padding:0 12px;font-size:15px;color:var(--txt);background:var(--surf);outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus{border-color:var(--felt2)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:46px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--felt);color:#fff}
.res-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.res-btn{height:38px;border-radius:8px;border:1.5px solid var(--bdr);background:var(--surf);font-size:13px;font-weight:600;cursor:pointer;color:var(--txt2)}
.res-btn.win.sel{background:var(--win);color:var(--win-tx);border-color:var(--win-tx)}
.res-btn.loss.sel{background:var(--loss);color:var(--loss-tx);border-color:var(--loss-tx)}
.res-btn.tie.sel{background:var(--tie);color:var(--tie-tx);border-color:var(--tie-tx)}
/* History */
.h-row{padding:12px 16px;border-bottom:1px solid var(--bdr)}
.h-row:last-child{border-bottom:none}
.h-top{display:flex;justify-content:space-between;align-items:center}
.h-player{font-size:14px;font-weight:600}
.h-net{font-size:14px;font-weight:700}
.h-meta{font-size:11px;color:var(--txt2);margin-top:3px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.chip.win{background:var(--win);color:var(--win-tx)}
.chip.loss{background:var(--loss);color:var(--loss-tx)}
.chip.tie{background:var(--tie);color:var(--tie-tx)}
/* By game */
.gtab-row{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.gtab-row::-webkit-scrollbar{display:none}
.g-chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;background:var(--surf);border:1.5px solid var(--bdr);color:var(--txt2);cursor:pointer;white-space:nowrap}
.g-chip.active{background:var(--felt);color:#fff;border-color:var(--felt)}
.bg-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bdr);gap:12px}
.bg-row:last-child{border-bottom:none}
.bg-row.positive{background:#f0faf4}
.bg-row.negative{background:#fff5f5}
/* Settings */
.s-sec{padding:16px 16px 8px}
.s-lbl{font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.p-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:var(--surf);border-bottom:1px solid var(--bdr)}
.p-row:first-of-type{border-radius:12px 12px 0 0}
.p-row:last-of-type{border-bottom:none;border-radius:0 0 12px 12px}
.p-row.only{border-radius:12px}
.del-btn{width:28px;height:28px;border-radius:50%;background:var(--loss);border:none;color:var(--loss-tx);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1;min-width:0;height:42px;border:1.5px solid var(--bdr);border-radius:8px;padding:0 12px;font-size:15px;color:var(--txt);background:var(--surf);outline:none}
.add-row input:focus{border-color:var(--felt2)}
.add-btn{height:42px;padding:0 16px;border-radius:8px;background:var(--felt);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
/* Empty */
.empty{text-align:center;padding:48px 24px;color:var(--txt2)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px}
/* Toast */
#toast{position:fixed;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%) translateY(20px);background:#1A1A1A;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div><h1>🎲 Game Night</h1><div class="sub" id="hdr-sub">Live standings</div></div>
    <div style="text-align:right">
      <div id="sync-dot" style="display:flex;align-items:center;gap:5px;font-size:11px;opacity:.8;justify-content:flex-end">
        <span id="dot" style="width:7px;height:7px;border-radius:50%;background:#8a8a8a;display:inline-block"></span>
        <span id="dot-label">Local only</span>
      </div>
      <div style="font-size:11px;opacity:.6" id="badge"></div>
    </div>
  </div>
  <div id="content"></div>
  <nav id="tabs">
    <button class="tab active" data-tab="leaderboard" onclick="nav('leaderboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Board
    </button>
    <button class="tab" data-tab="log" onclick="nav('log')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Log
    </button>
    <button class="tab" data-tab="history" onclick="nav('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 0 .5-3"/><polyline points="3 4 3 11 10 11"/></svg>History
    </button>
    <button class="tab" data-tab="bygame" onclick="nav('bygame')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="9" height="9"/><rect x="13" y="2" width="9" height="9"/><rect x="2" y="13" width="9" height="9"/><rect x="13" y="13" width="9" height="9"/></svg>By Game
    </button>
    <button class="tab" data-tab="profile" onclick="nav('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Profile
    </button>
    <button class="tab" data-tab="settings" onclick="nav('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings
    </button>
  </nav>
</div>
<div id="toast"></div>
<script>
// ═══════════════════════════════════════════════════════════════
// LIVE SYNC SETUP — fill this in with your own free Firebase project
// to get a shared live board across devices. See README.md for the
// step-by-step. Until you do, the app just runs locally per device.
// ═══════════════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
};

const STORAGE_KEY='gnt_v2';
const AV_COLORS=['#0B3D2E','#1B5E8E','#6B2D8B','#A0522D','#2E604A','#7B3F3F','#1A5276','#6E2F4A','#3D6B21','#704A1A'];
const BAR_COLORS=['#D4AF37','#C0C0C0','#CD7F32','#0B3D2E','#4a9d7a','#8a5ab8','#c05050','#507ac0'];

function getRoomId(){
  const params=new URLSearchParams(location.search);
  let r=params.get('room');
  if(r){ localStorage.setItem('gnt_room',r); return r; }
  r=localStorage.getItem('gnt_room');
  if(r) return r;
  r=Math.random().toString(36).slice(2,8);
  localStorage.setItem('gnt_room',r);
  return r;
}
const roomId=getRoomId();
if(!new URLSearchParams(location.search).get('room')){
  const u=new URL(location.href); u.searchParams.set('room',roomId);
  history.replaceState({},'',u);
}

function sanitizeState(obj){
  if(!obj || typeof obj !== 'object') return { players:[], games:[], sessions:[] };
  return {
    players: Array.isArray(obj.players) ? obj.players : [],
    games: Array.isArray(obj.games) ? obj.games : [],
    sessions: Array.isArray(obj.sessions) ? obj.sessions : []
  };
}

let state = sanitizeState((()=>{
  try{ const r=localStorage.getItem(STORAGE_KEY); if(r) return JSON.parse(r); }catch(e){}
  return { players:['Alice','Bob','Charlie','Diana'], games:['Poker','Mahjong','Uno'], sessions:[] };
})());
if(ensureIds()) localStorage.setItem(STORAGE_KEY,JSON.stringify(state));

let fbRef=null, applyingRemote=false, syncEnabled=false;

function initFirebase(){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey==="YOUR_API_KEY") return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbRef=firebase.database().ref('rooms/'+roomId);
    fbRef.on('value', snap=>{
      const remote=snap.val();
      if(remote){
        applyingRemote=true;
        state=sanitizeState(remote);
        ensureIds();
        localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
        applyingRemote=false;
        try{ render(); }catch(e){ console.error('Render error after sync:', e); }
      } else {
        fbRef.set(state);
      }
      syncEnabled=true;
      setSyncBadge(true);
    }, err=>{ console.error('Firebase sync error:', err); setSyncBadge(false); });
  }catch(e){ console.error(e); setSyncBadge(false); }
}

function setSyncBadge(live){
  const dot=document.getElementById('dot'), label=document.getElementById('dot-label');
  if(!dot) return;
  if(live){ dot.style.background='#4CD964'; label.textContent='Live sync'; }
  else { dot.style.background='#8a8a8a'; label.textContent='Local only'; }
}

let currentTab='leaderboard', activeGame=null, editingId=null;
const EDIT_WINDOW_MS = 5*60*1000; // entries lock 5 minutes after logging

function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function isEditable(s){ return (Date.now() - new Date(s.date).getTime()) < EDIT_WINDOW_MS; }

function ensureIds(){
  let changed=false;
  state.sessions.forEach(s=>{ if(!s.id){ s.id=genId(); changed=true; } });
  return changed;
}
let form={ game:'', player:'', amtIn:0, amtOut:0, gifted:0, result:'', sessionNum:1 };

function save(localOnly){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  if(!localOnly && fbRef && !applyingRemote){ fbRef.set(state); }
}

function fmt(n){
  const abs=Math.abs(n);
  return (n<0?'-':'')+'$'+abs.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

function av(player,idx){
  const c=AV_COLORS[idx%AV_COLORS.length];
  return `<div class="lb-av" style="background:${c};color:#fff">${initials(player)}</div>`;
}

function calcPot(s){
  if(s.result!=='Win') return 0;
  const sd=new Date(s.date).toDateString();
  return state.sessions.filter(x=>
    new Date(x.date).toDateString()===sd && x.sessionNum===s.sessionNum && x.game===s.game
  ).reduce((a,x)=>a+(x.gifted||0),0);
}

function recalcPots(){ state.sessions=state.sessions.map(s=>({...s,potWon:calcPot(s)})); }

function computeLB(){
  return state.players.map((player,idx)=>{
    const rows=state.sessions.filter(s=>s.player===player);
    const wins=rows.filter(r=>r.result==='Win').length;
    const losses=rows.filter(r=>r.result==='Loss').length;
    const ties=rows.filter(r=>r.result==='Tie').length;
    const played=rows.length;
    const totalIn=rows.reduce((a,r)=>a+(r.amtIn||0),0);
    const totalOut=rows.reduce((a,r)=>a+(r.amtOut||0),0);
    const totalGifted=rows.reduce((a,r)=>a+(r.gifted||0),0);
    const totalPotWon=rows.reduce((a,r)=>a+(r.potWon||0),0);
    const net=(totalOut-totalIn)+totalPotWon; // gifting isn't a loss — only your own buy-in/cash-out and any pot you win count
    const giftsGiven=rows.filter(r=>(r.gifted||0)>0).length;
    const smoothed=(wins+1)/(played+2);
    return{player,idx,wins,losses,ties,played,totalIn,totalOut,totalGifted,totalPotWon,net,giftsGiven,smoothed};
  });
}

function addProbs(lb){
  const total=lb.reduce((a,p)=>a+p.smoothed,0);
  return lb.map(p=>({...p,winProb:total>0?p.smoothed/total:1/lb.length}));
}

function sorted(lb){ return [...lb].sort((a,b)=>b.net-a.net||b.wins-a.wins); }

function nav(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  render();
}

function render(){
  const el=document.getElementById('content');
  const sub=document.getElementById('hdr-sub');
  const badge=document.getElementById('badge');
  badge.textContent=state.sessions.length?state.sessions.length+' entries':'';
  const subs={leaderboard:'Live standings',log:'Add a result',history:'All sessions',bygame:'Game breakdown',profile:'Player profiles',settings:'Players & games'};
  sub.textContent=subs[currentTab]||'';
  const fns={leaderboard:rLeaderboard,log:rLog,history:rHistory,bygame:rByGame,profile:rProfile,settings:rSettings};
  el.innerHTML=(fns[currentTab]||rLeaderboard)();
  if(currentTab==='log') bindLog();
  if(currentTab==='bygame') bindGameTabs();
  if(currentTab==='settings') bindSettings();
}

function rLeaderboard(){
  const lb=addProbs(computeLB());
  const s=sorted(lb);
  if(!state.players.length) return '<div class="empty"><div class="empty-icon">🎲</div><p>Add players in Settings</p></div>';
  const leader=s[0];
  const heroHtml=`<div class="lb-hero">
    <div class="crown">🏆</div>
    <div class="lname">${leader.player}</div>
    <div class="lnet">${leader.played?fmt(leader.net)+' net':'No games yet'}</div>
    <div class="lprob">${(leader.winProb*100).toFixed(0)}% chance to win next</div>
  </div>`;
  const rowsHtml=s.slice(1).map((p,i)=>{
    const rank=i+2;
    const rc=rank===2?'r2':rank===3?'r3':'';
    return `<div class="lb-row">
      <div class="lb-rank ${rc}">${rank}</div>
      ${av(p.player,p.idx)}
      <div class="lb-info">
        <div class="lb-name">${p.player}</div>
        <div class="lb-stats">${p.wins}W · ${p.losses}L · ${p.ties}T · ${p.played} played</div>
      </div>
      <div class="lb-right">
        <div class="lb-net ${p.net>0?'pos':p.net<0?'neg':''}">${p.played?fmt(p.net):'—'}</div>
        <div class="lb-prob">${(p.winProb*100).toFixed(0)}% next win</div>
      </div>
    </div>`;
  }).join('');
  const barSegs=s.map((p,i)=>
    `<div class="prob-seg" style="width:${(p.winProb*100).toFixed(1)}%;background:${BAR_COLORS[i]||'#888'}"></div>`
  ).join('');
  const legend=s.map((p,i)=>
    `<span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px;font-size:10px;color:var(--txt2)"><span style="width:8px;height:8px;border-radius:50%;background:${BAR_COLORS[i]||'#888'};display:inline-block"></span>${p.player} ${(p.winProb*100).toFixed(0)}%</span>`
  ).join('');
  const totalGifted=state.sessions.reduce((a,s)=>a+(s.gifted||0),0);
  const topGifter=(()=>{
    if(!state.sessions.length) return '—';
    const m={};
    state.sessions.forEach(s=>{m[s.player]=(m[s.player]||0)+(s.gifted||0);});
    return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
  })();
  return `<div class="card" style="margin:16px 16px 0;border-radius:14px;box-shadow:0 4px 20px rgba(11,61,46,.18)">
    ${heroHtml}
    <div style="padding:12px 16px 8px;background:var(--surf)">
      <div style="font-size:11px;color:var(--txt2);margin-bottom:4px">Win probability — next game</div>
      <div class="prob-track">${barSegs}</div>
      <div style="margin-top:6px">${legend}</div>
    </div>
    ${s.length>1?'<div style="border-top:1px solid var(--bdr)">'+rowsHtml+'</div>':''}
  </div>
  <div class="stats-grid" style="margin-top:12px">
    <div class="stat-card"><div class="stat-lbl">Sessions logged</div><div class="stat-val">${state.sessions.length}</div></div>
    <div class="stat-card"><div class="stat-lbl">Total gifted</div><div class="stat-val">${fmt(totalGifted)}</div></div>
    <div class="stat-card"><div class="stat-lbl">Top gifter</div><div class="stat-val" style="font-size:15px">${topGifter}</div></div>
    <div class="stat-card"><div class="stat-lbl">Games tracked</div><div class="stat-val">${state.games.length}</div></div>
  </div><div style="height:12px"></div>`;
}

function rLog(){
  const gOpts=state.games.map(g=>`<option value="${g}" ${form.game===g?'selected':''}>${g}</option>`).join('');
  const pOpts=state.players.map(p=>`<option value="${p}" ${form.player===p?'selected':''}>${p}</option>`).join('');
  const recent=state.sessions.slice(-5).reverse().map(s=>{
    const net=(s.amtOut-s.amtIn)+(s.potWon||0);
    const cc=s.result==='Win'?'win':s.result==='Loss'?'loss':'tie';
    return `<div class="h-row">
      <div class="h-top"><div class="h-player">${s.player} <span class="chip ${cc}">${s.result}</span></div><div class="h-net ${net>0?'pos':net<0?'neg':''}">${fmt(net)}</div></div>
      <div class="h-meta">${s.game} · Session ${s.sessionNum||1} · In ${fmt(s.amtIn||0)} · Gifted ${fmt(s.gifted||0)}</div>
    </div>`;
  }).join('');
  return `<div style="height:12px"></div>
  <div class="form-card">
    <div class="form-title">${editingId?'✏️ Edit game result':'🎮 Log a game result'}</div>
    <div class="field"><label>Game</label><select id="f-game"><option value="">Select game…</option>${gOpts}</select></div>
    <div class="field"><label>Player</label><select id="f-player"><option value="">Select player…</option>${pOpts}</select></div>
    <div class="field"><label>Session #</label><input id="f-sess" type="number" min="1" value="${form.sessionNum}" placeholder="1"></div>
    <div class="field-row">
      <div class="field"><label>Amount In ($)</label><input id="f-in" type="number" min="0" placeholder="0" value="${form.amtIn||''}"></div>
      <div class="field"><label>Amount Out ($)</label><input id="f-out" type="number" min="0" placeholder="0" value="${form.amtOut||''}"></div>
    </div>
    <div class="field"><label>Amount Gifted to Pot ($) <span style="font-weight:400;color:var(--txt2)">— 0 if not gifting</span></label><input id="f-gifted" type="number" min="0" placeholder="0" value="${form.gifted||''}"></div>
    <div class="field"><label>Result</label>
      <div class="res-row">
        <button class="res-btn win ${form.result==='Win'?'sel':''}" onclick="setResult('Win')">🏆 Win</button>
        <button class="res-btn loss ${form.result==='Loss'?'sel':''}" onclick="setResult('Loss')">😞 Loss</button>
        <button class="res-btn tie ${form.result==='Tie'?'sel':''}" onclick="setResult('Tie')">🤝 Tie</button>
      </div>
    </div>
    <button class="btn btn-primary" onclick="submitLog()">${editingId?'Update Result':'Save Result'}</button>
    ${editingId?`<button class="btn" style="background:var(--surf2);color:var(--txt2);margin-top:8px" onclick="cancelEdit()">Cancel Edit</button>`:''}
  </div>
  ${recent?`<div style="padding:0 16px 8px"><div style="font-size:13px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Recent</div><div class="card">${recent}</div></div>`:''}
  <div style="height:12px"></div>`;
}

function rHistory(){
  if(!state.sessions.length) return '<div class="empty"><div class="empty-icon">📋</div><p>No games logged yet</p></div>';
  const byDate={};
  [...state.sessions].reverse().forEach(s=>{
    const dk=new Date(s.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    if(!byDate[dk]) byDate[dk]=[];
    byDate[dk].push(s);
  });
  return '<div style="height:12px"></div>'+Object.entries(byDate).map(([date,sessions])=>{
    const rows=sessions.map(s=>{
      const net=(s.amtOut-s.amtIn)+(s.potWon||0);
      const cc=s.result==='Win'?'win':s.result==='Loss'?'loss':'tie';
      const editable=isEditable(s);
      const actions=editable
        ? `<div style="display:flex;gap:14px;margin-top:6px">
             <button style="border:none;background:none;color:var(--felt2);font-size:11px;font-weight:700;cursor:pointer;padding:0" onclick="editSession('${s.id}')">Edit</button>
             <button style="border:none;background:none;color:var(--loss-tx);font-size:11px;font-weight:700;cursor:pointer;padding:0" onclick="deleteSession('${s.id}')">Delete</button>
           </div>`
        : `<div style="font-size:10px;color:#aab0aa;margin-top:6px">🔒 Locked — editable for 5 min after logging</div>`;
      return `<div class="h-row">
        <div class="h-top"><div class="h-player">${s.player} <span class="chip ${cc}">${s.result}</span></div><div class="h-net ${net>0?'pos':net<0?'neg':''}">${fmt(net)}</div></div>
        <div class="h-meta">${s.game} · Sess ${s.sessionNum||1} · In ${fmt(s.amtIn||0)} · Out ${fmt(s.amtOut||0)} · Gifted ${fmt(s.gifted||0)} · Pot Won ${fmt(s.potWon||0)}</div>
        ${actions}
      </div>`;
    }).join('');
    return `<div style="padding:0 16px 8px"><div style="font-size:13px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">${date}</div><div class="card">${rows}</div></div>`;
  }).join('')+'<div style="height:12px"></div>';
}

function rByGame(){
  if(!state.games.length) return '<div class="empty"><div class="empty-icon">🎯</div><p>No games added yet</p></div>';
  const ag=activeGame||state.games[0];
  const tabs=state.games.map(g=>`<div class="g-chip ${g===ag?'active':''}" data-game="${g}">${g}</div>`).join('');
  const rows=state.players.map((player,idx)=>{
    const r=state.sessions.filter(s=>s.player===player&&s.game===ag);
    const wins=r.filter(x=>x.result==='Win').length;
    const losses=r.filter(x=>x.result==='Loss').length;
    const ties=r.filter(x=>x.result==='Tie').length;
    const net=r.reduce((a,x)=>a+((x.amtOut-x.amtIn)+(x.potWon||0)),0);
    const cls=r.length?(net>0?'positive':net<0?'negative':''):'';
    return `<div class="bg-row ${cls}">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        ${av(player,idx)}
        <div>
          <div style="font-size:14px;font-weight:600">${player}</div>
          <div style="font-size:11px;color:var(--txt2)">${wins}W · ${losses}L${ties?' · '+ties+'T':''} · ${r.length} played</div>
        </div>
      </div>
      <div style="font-size:15px;font-weight:700;${net>0?'color:var(--win-tx)':net<0?'color:var(--loss-tx)':''}">${r.length?fmt(net):'—'}</div>
    </div>`;
  }).join('');
  return `<div style="height:12px"></div>
  <div class="gtab-row">${tabs}</div>
  <div style="padding:0 16px 12px"><div class="card">${rows}</div></div>
  <div style="height:12px"></div>`;
}

function rProfile(){
  if(!state.players.length) return '<div class="empty"><div class="empty-icon">🙍</div><p>Add players in Settings</p></div>';
  const lb=computeLB();
  const groupTotal=lb.reduce((a,p)=>a+p.totalGifted,0);
  const maxGifted=Math.max(0,...lb.map(p=>p.totalGifted));
  const byGifted=[...lb].sort((a,b)=>b.totalGifted-a.totalGifted);
  const rows=byGifted.map(p=>{
    const isTopGifter=p.totalGifted>0 && p.totalGifted===maxGifted;
    return `<div class="card" style="margin:0 16px 10px;padding:14px 16px;display:flex;align-items:center;gap:12px">
      ${av(p.player,p.idx)}
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span>${p.player}</span>
          ${isTopGifter?'<span style="font-size:11px;background:var(--gold-lt);color:#7a5d00;padding:1px 8px;border-radius:20px;font-weight:700;white-space:nowrap">🎁 Top Gifter</span>':''}
        </div>
        <div style="font-size:11px;color:var(--txt2);margin-top:2px">${p.wins}W · ${p.losses}L · ${p.ties}T · ${p.played} played · ${p.giftsGiven} gift${p.giftsGiven===1?'':'s'} given</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:11px;color:var(--txt2)">Gifted</div>
        <div style="font-size:18px;font-weight:700;color:#8E7CC3">${fmt(p.totalGifted)}</div>
      </div>
    </div>`;
  }).join('');
  return `<div style="height:12px"></div>
  <div style="padding:0 16px 12px;text-align:center">
    <div style="font-size:11px;color:var(--txt2)">Total gifted across the group</div>
    <div style="font-size:24px;font-weight:700;color:#8E7CC3">${fmt(groupTotal)}</div>
  </div>
  ${rows}
  <div style="height:12px"></div>`;
}

function rSettings(){
  const pList=state.players.map((p,i)=>`<div class="p-row ${state.players.length===1?'only':''}"><span style="font-size:15px;font-weight:500">${p}</span><button class="del-btn" onclick="delPlayer(${i})">×</button></div>`).join('');
  const gList=state.games.map((g,i)=>`<div class="p-row ${state.games.length===1?'only':''}"><span style="font-size:15px;font-weight:500">${g}</span><button class="del-btn" onclick="delGame(${i})">×</button></div>`).join('');
  const shareUrl=location.href;
  const syncCard=syncEnabled
    ? `<div class="p-row only"><div><div style="font-size:15px;font-weight:500">🟢 Live sync active</div><div style="font-size:12px;color:var(--txt2)">Everyone with this link sees the same board, updated instantly.</div></div></div>`
    : `<div class="p-row only"><div><div style="font-size:15px;font-weight:500">⚪ Local only</div><div style="font-size:12px;color:var(--txt2)">Set up Firebase (free, 5 min) to sync live across devices — see README.md.</div></div></div>`;
  return `<div style="height:12px"></div>
  <div class="s-sec"><div class="s-lbl">Share &amp; Sync</div>
    <div class="card">${syncCard}</div>
    <div class="add-row"><input id="share-url" type="text" readonly value="${shareUrl}" style="font-size:12px;color:var(--txt2)"><button class="add-btn" onclick="copyShareUrl()">Copy Link</button></div>
    <div style="font-size:11px;color:var(--txt2);margin-top:6px;padding:0 2px">Room code: <strong>${roomId}</strong> — share this exact link with your group; only people with it see this board.</div>
  </div>
  <div class="s-sec"><div class="s-lbl">Players</div>
    <div class="card">${pList||'<div style="padding:12px 16px;color:var(--txt2);font-size:14px">No players yet</div>'}</div>
    <div class="add-row"><input id="np" type="text" placeholder="Add player name…" maxlength="30"><button class="add-btn" onclick="addPlayer()">Add</button></div>
  </div>
  <div class="s-sec"><div class="s-lbl">Games</div>
    <div class="card">${gList||'<div style="padding:12px 16px;color:var(--txt2);font-size:14px">No games yet</div>'}</div>
    <div class="add-row"><input id="ng" type="text" placeholder="Add game name…" maxlength="30"><button class="add-btn" onclick="addGame()">Add</button></div>
  </div>
  <div class="s-sec"><div class="s-lbl">Data</div>
    <div class="card">
      <div class="p-row only"><div><div style="font-size:15px;font-weight:500">Export backup</div><div style="font-size:12px;color:var(--txt2)">Download as JSON</div></div><button class="add-btn" onclick="exportData()" style="height:34px;padding:0 12px;font-size:13px">Export</button></div>
    </div>
    <div style="height:8px"></div>
    <div class="card">
      <div class="p-row only"><div><div style="font-size:15px;font-weight:500;color:var(--loss-tx)">Clear sessions</div><div style="font-size:12px;color:var(--txt2)">Keeps players &amp; games</div></div><button class="del-btn" style="width:auto;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600" onclick="clearSess()">Clear</button></div>
    </div>
  </div>
  <div style="padding:16px;color:var(--txt2);font-size:12px;text-align:center;line-height:1.7">
    <strong style="display:block;margin-bottom:4px;color:var(--txt)">📱 Install as app on your phone</strong>
    <strong>iPhone:</strong> tap the Share button → "Add to Home Screen"<br>
    <strong>Android:</strong> tap ⋮ menu → "Add to Home screen"
  </div>
  <div style="height:12px"></div>`;
}

function copyShareUrl(){
  const el=document.getElementById('share-url');
  el.select(); el.setSelectionRange(0,99999);
  navigator.clipboard?.writeText(el.value).then(()=>toast('Link copied!')).catch(()=>toast('Copy failed — select and copy manually'));
}

function setResult(r){ form.result=r; render(); }

function bindLog(){
  ['f-game','f-player','f-sess','f-in','f-out','f-gifted'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.addEventListener('change',()=>{
      if(id==='f-game') form.game=el.value;
      else if(id==='f-player') form.player=el.value;
      else if(id==='f-sess') form.sessionNum=parseInt(el.value)||1;
      else if(id==='f-in') form.amtIn=parseFloat(el.value)||0;
      else if(id==='f-out') form.amtOut=parseFloat(el.value)||0;
      else if(id==='f-gifted') form.gifted=parseFloat(el.value)||0;
    });
  });
}

function bindGameTabs(){
  document.querySelectorAll('.g-chip').forEach(el=>{
    el.addEventListener('click',()=>{ activeGame=el.dataset.game; render(); });
  });
}

function bindSettings(){
  const np=document.getElementById('np');
  const ng=document.getElementById('ng');
  if(np) np.addEventListener('keydown',e=>{ if(e.key==='Enter') addPlayer(); });
  if(ng) ng.addEventListener('keydown',e=>{ if(e.key==='Enter') addGame(); });
}

function submitLog(){
  const game=document.getElementById('f-game')?.value||form.game;
  const player=document.getElementById('f-player')?.value||form.player;
  const sessionNum=parseInt(document.getElementById('f-sess')?.value)||1;
  const amtIn=parseFloat(document.getElementById('f-in')?.value)||0;
  const amtOut=parseFloat(document.getElementById('f-out')?.value)||0;
  const gifted=parseFloat(document.getElementById('f-gifted')?.value)||0;
  const result=form.result;
  if(!game){ toast('Select a game'); return; }
  if(!player){ toast('Select a player'); return; }
  if(!result){ toast('Select Win / Loss / Tie'); return; }

  if(editingId){
    const idx=state.sessions.findIndex(x=>x.id===editingId);
    if(idx===-1){ toast('Entry not found — it may have been deleted'); editingId=null; nav('history'); return; }
    if(!isEditable(state.sessions[idx])){ toast('Editing window has expired'); editingId=null; nav('history'); return; }
    state.sessions[idx]={...state.sessions[idx],game,player,sessionNum,amtIn,amtOut,gifted,result};
    recalcPots(); save();
    editingId=null;
    form={game:'',player:'',amtIn:0,amtOut:0,gifted:0,result:'',sessionNum:1};
    toast('Result updated!');
    nav('history');
    return;
  }

  state.sessions.push({id:genId(),date:new Date().toISOString(),game,player,sessionNum,amtIn,amtOut,gifted,potWon:0,result});
  recalcPots(); save();
  form={game,player:'',amtIn:0,amtOut:0,gifted:0,result:'',sessionNum};
  toast('Result saved!'); render();
}

function editSession(id){
  const s=state.sessions.find(x=>x.id===id);
  if(!s){ toast('Entry not found'); return; }
  if(!isEditable(s)){ toast('Editing window has expired'); render(); return; }
  editingId=id;
  form={game:s.game,player:s.player,amtIn:s.amtIn,amtOut:s.amtOut,gifted:s.gifted,result:s.result,sessionNum:s.sessionNum||1};
  nav('log');
}

function deleteSession(id){
  const s=state.sessions.find(x=>x.id===id);
  if(!s){ toast('Entry not found'); return; }
  if(!isEditable(s)){ toast('Editing window has expired'); render(); return; }
  if(!confirm('Delete this entry? This cannot be undone.')) return;
  state.sessions=state.sessions.filter(x=>x.id!==id);
  recalcPots(); save();
  toast('Entry deleted');
  render();
}

function cancelEdit(){
  editingId=null;
  form={game:'',player:'',amtIn:0,amtOut:0,gifted:0,result:'',sessionNum:1};
  nav('history');
}

function addPlayer(){
  const el=document.getElementById('np');
  const name=el?.value.trim();
  if(!name){ toast('Enter a name'); return; }
  if(state.players.includes(name)){ toast('Already added'); return; }
  state.players.push(name); save(); if(el) el.value=''; render();
}

function delPlayer(idx){
  const name=state.players[idx];
  if(state.sessions.some(s=>s.player===name)&&!confirm('Delete '+name+'? History stays.')) return;
  state.players.splice(idx,1); save(); render();
}

function addGame(){
  const el=document.getElementById('ng');
  const name=el?.value.trim();
  if(!name){ toast('Enter a game name'); return; }
  if(state.games.includes(name)){ toast('Already added'); return; }
  state.games.push(name); save(); if(el) el.value=''; render();
}

function delGame(idx){
  const name=state.games[idx];
  state.games.splice(idx,1);
  if(activeGame===name) activeGame=state.games[0]||null;
  save(); render();
}

function clearSess(){
  if(!confirm('Clear all sessions?')) return;
  state.sessions=[]; save(); toast('Cleared'); render();
}

function exportData(){
  const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u; a.download='game-night-backup.json'; a.click();
  URL.revokeObjectURL(u); toast('Exported!');
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

try {
render();
} catch(e) {
  console.error('Initial render failed:', e);
  const c = document.getElementById('content');
  if (c) c.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Something went wrong loading saved data.<br>Go to Settings → Clear sessions, or clear this site\'s data in your browser, then reload.</p></div>';
}
setSyncBadge(false);
initFirebase();

// keep the 5-minute edit lock accurate without requiring a manual refresh
setInterval(()=>{ if(currentTab==='history') render(); }, 30000);
</script>
</body>
</html>
